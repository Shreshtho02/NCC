{% extends "main/base.html" %}

{% block title %}Events{% endblock %}

{% block content %}
<section class="bg-bg px-6 py-12 md:px-16">

    <h1 class="font-grotesk text-3xl md:text-4xl font-bold text-text mb-8">
        Events
    </h1>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
        {% for event in events %}
        <a href="{% url 'event_detail' event.slug %}"
           class="group relative overflow-hidden rounded-xl bg-surface shadow-lg flex flex-col border border-text-muted/10 hover:border-[var(--event-accent)]/60 transition"
           style="--event-accent: {{ event.primary_color }};">

            <div class="aspect-[4/3] overflow-hidden bg-bg">
                {% if event.banner %}
                    <img class="w-full h-full object-cover transition duration-300 group-hover:scale-105"
                         src="{{ event.banner.url }}" alt="{{ event.name }} banner">
                {% else %}
                    <div class="w-full h-full flex items-center justify-center text-text-muted text-sm">
                        No banner
                    </div>
                {% endif %}
            </div>

            <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/85 to-transparent p-4 pt-10">
                <h3 class="text-lg font-bold text-white tracking-wide drop-shadow-md line-clamp-2">
                    {{ event.name }}
                </h3>
                <p class="text-xs text-[var(--event-accent)] font-medium mt-1 uppercase tracking-wide">
                    {{ event.status }}
                </p>
            </div>

        </a>
        {% endfor %}
    </div>

</section>
{% endblock %}
