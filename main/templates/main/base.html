<!DOCTYPE html>
{% load static tailwind_cli %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% tailwind_css %}
    <title>{% block title %}Shreshtho's Website{% endblock %}</title>
</head>
<body class="bg-ink text-paper font-mono">
    <nav class="sticky top-0 z-50 bg-ink border-b-[3px] border-paper">
        <div class="flex items-center justify-between px-6 md:px-16 py-4">
    
            <div class="flex items-center gap-10">
                <a href="{% url 'homepage' %}" class="font-display font-black text-2xl tracking-tight">
                    GSCCC<span style="color: var(--color-accent);">.</span>
                </a>
    
                <div class="hidden md:flex items-center gap-8 font-mono text-sm uppercase tracking-wide">
                    <a href="{% url 'event_list' %}" class="hover:text-[var(--color-accent)] transition-colors">Events</a>
                    <a href="{% url 'aboutpage' %}" class="hover:text-[var(--color-accent)] transition-colors">About</a>
                </div>
            </div>
    
            <div class="hidden md:flex items-center gap-6">
                <span class="w-[2px] h-6 bg-paper/30"></span>
                <a href="{% url 'event_detail' 'ncc' %}">
                    <button class="btn relative overflow-hidden font-display font-bold text-xs py-2.5 px-5"
                            style="background: var(--color-accent); border-color: var(--color-accent); color: var(--color-ink); box-shadow: 5px 5px 0 var(--color-paper);">
                        <span class="relative z-10">Register for NCC</span>
                        <span class="animate-shimmer pointer-events-none absolute inset-y-0 left-0 w-1/3 bg-paper/40"></span>
                    </button>
                </a>
            </div>
    
            <button id="nav-toggle" class="md:hidden flex flex-col gap-1.5 border-2 border-paper p-2" aria-label="Toggle menu" aria-expanded="false">
                <span class="block w-5 h-0.5 bg-paper"></span>
                <span class="block w-5 h-0.5 bg-paper"></span>
                <span class="block w-5 h-0.5 bg-paper"></span>
            </button>
    
        </div>
    
        <div id="mobile-menu" class="hidden md:hidden flex-col font-mono uppercase text-sm px-6 pb-5">
            <a href="{% url 'event_list' %}" class="py-3 border-t-2 border-paper">Events</a>
            <a href="{% url 'aboutpage' %}" class="py-3 border-t-2 border-paper">About</a>
            <a href="{% url 'event_register' 'ncc' %}" class="pt-4">
                <button class="btn w-full font-display font-bold text-xs"
                        style="background: var(--color-accent); border-color: var(--color-accent); color: var(--color-ink); box-shadow: 5px 5px 0 var(--color-paper);">
                    Register
                </button>
            </a>
        </div>
    </nav>

    <main class="min-h-[70vh]">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="border-t border-text-muted/15 mt-20">
        <div class="max-w-6xl mx-auto px-4 md:px-8 py-8 flex flex-col md:flex-row items-center justify-between gap-4 text-sm text-text-muted font-normal">
            <p>&copy; 2026 Government Science College Cultural Club</p>
            <div class="flex gap-6">
                <a href="{% url 'event_list' %}" class="hover:text-text transition">Events</a>
                <a href="{% url 'aboutpage' %}" class="hover:text-text transition">About</a>
            </div>
        </div>
    </footer>

    <script>
        const toggle = document.getElementById('nav-toggle');
        const menu = document.getElementById('mobile-menu');
        toggle.addEventListener('click', () => {
            const isOpen = menu.classList.toggle('flex');
            menu.classList.toggle('hidden');
            toggle.setAttribute('aria-expanded', isOpen);
        });
    </script>

</body>
</html>
